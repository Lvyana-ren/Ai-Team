name: UI-UX Pro Max validation

on:
  push:
    branches: [main]
    paths:
      - 'agents/designer/skills/upstream/ui-ux-pro-max/**'
      - '.github/workflows/ui-ux-pro-max-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate vendored catalog data
        run: python agents/designer/skills/upstream/ui-ux-pro-max/scripts/validate_data.py
      - name: Smoke-test domain, stack, and design-system search
        shell: bash
        run: |
          set -euo pipefail
          SEARCH=agents/designer/skills/upstream/ui-ux-pro-max/scripts/search.py
          python "$SEARCH" "dark dashboard" --domain style --json > /tmp/style.json
          python "$SEARCH" "keyboard focus modal" --domain ux --json > /tmp/ux.json
          python "$SEARCH" "accessible icon button" --domain icons --json > /tmp/icons.json
          python "$SEARCH" "dashboard typography" --domain typography --json > /tmp/typography.json
          python "$SEARCH" "jetpack compose state" --stack jetpack-compose --json > /tmp/compose.json
          python "$SEARCH" "AI productivity dashboard" --design-system --json > /tmp/design-system.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("style", "ux", "icons", "typography", "compose", "design-system"):
              payload = json.loads(Path(f"/tmp/{name}.json").read_text())
              if name == "design-system":
                  assert payload.get("design_system"), "empty design-system result"
              else:
                  assert payload, f"empty {name} result"
              print(f"PASS: {name} search returned structured output")
          PY
      - name: Run package-contained upstream tests and Xen layout tests
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          import unittest
          from pathlib import Path

          test_dir = Path("agents/designer/skills/upstream/ui-ux-pro-max/scripts/tests").resolve()
          sys.path.insert(0, str(test_dir.parent))
          sys.path.insert(0, str(test_dir))
          excluded = {
              "test_catalog_refresh.py",
              "test_catalog_summary_line_endings.py",
              "test_design_system_tokens.py",
              "test_relevance_evaluator.py",
              "test_skill_script_paths.py",
          }
          suite = unittest.TestSuite()
          loader = unittest.TestLoader()
          for path in sorted(test_dir.glob("test_*.py")):
              if path.name in excluded:
                  print(f"SKIP (requires upstream monorepo files): {path.name}")
                  continue
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              suite.addTests(loader.loadTestsFromModule(module))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY
